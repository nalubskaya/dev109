<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Rhombus webpage to use JS and CSS for PROG 109 - A03">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="keywords" content="Rhombus, Prog109-CSS, A03">
<title>Natalia Lubskaya</title>
<!-- this link css script-->
<link rel="stylesheet" media="screen" href="style.css" type="text/css">
<link rel="stylesheet" media="screen" href="https://fontlibrary.org/en/face/dancing-font" type="text/css">
</head>
<body>
  <div class="container">
        <h2>Diamond Design</h2>
        <div>  
	<form id="dimondshape" onSubmit="return false;">
		<label for="size">Enter size for rhombus(odd number): </label><br>
            		<input type="number" id="size" value="5" min="1" max="100" step="2">			<br><br>

  		<label for="oddcolors">Pick color for odd sides</label><br>
		 <select id="oddcolors">
		<!--add color selection for the drop down option-->
			<option value="#F0A3FF">Lavender</option>
    			<option value="#000000">Black</option>
    			<option value="#FF0000">Red</option>
    			<option value="#00FF00">Green</option>
    			<option value="#0000FF">Blue</option>
		  </select>
		<br><br>
  		<label for="evencolors">Pick color for even sides</label><br>
		 <select id="evencolors">
		<!--add color selection for the drop down option for even numbers of design-->
    			<option value="#000000">Black</option>
			<option value="#F0A3FF">Lavender</option>
    			<option value="#FF0000">Red</option>
    			<option value="#00FF00">Green</option>
    			<option value="#0000FF">Blue</option>
		  </select>
		<br><br>
  		<label for="shape">Pick design for the shape</label><br>
		 <select id="shape">
		<!--add color selection for the drop down option for even numbers of design-->
			<option value="#">#</option>
    			<option value="*">*</option>
    			<option value="0">0</option>
    			<option value="$">$</option>
    			<option value="%">%</option>
		  </select>
		<br><br>
           <button onclick="makeDiamond()">Display Rhombus</button>

	</form>
   <div id="output"></div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
